# Indsættes i server-blokken for det domæne der skal hoste ladeagenten (HTTPS).
# Claude custom connectors taler Streamable HTTP: POST (JSON-RPC) og GET (SSE) på samme path.
location ^~ /mcp {
    proxy_pass http://127.0.0.1:8765/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    chunked_transfer_encoding on;
}
