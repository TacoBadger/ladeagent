# /etc/nginx/sites-available/__DOMAIN__
# Skrives af deploy/install.sh, når certifikatet findes. Ret i repoet, ikke på serveren.

# Forsiden kalder /api/ fra browseren. 5 kald i sekundet pr. adresse er rigeligt til et menneske.
limit_req_zone $binary_remote_addr zone=ladeagent_api:10m rate=5r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/ladeagent;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Ladeagent MCP (Streamable HTTP). Claude custom connectors: https://__DOMAIN__/mcp
    location ^~ /mcp {
        proxy_pass http://127.0.0.1:8765/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # JSON til forsiden: samme read-tools som MCP, kun GET, ingen model (ladeagent/web.py)
    location ^~ /api/ {
        limit_except GET { deny all; }
        limit_req zone=ladeagent_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # Forsiden er statiske filer fra site/ i repoet. Den virker også, hvis Python-servicen er nede.
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        expires -1;   # giver Cache-Control: no-cache uden at slå add_header ovenfor fra
        try_files $uri $uri/ =404;
    }
}

# Samme form som certbot selv skriver, så fornyelse af certifikatet virker som før.
server {
    if ($host = __DOMAIN__) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    return 404;
}
