# /etc/nginx/sites-available/fontlume.com  (certbot tilføjer selv 443/TLS-blokken)
server {
    listen 80;
    listen [::]:80;
    server_name fontlume.com www.fontlume.com;

    # Ladeagent MCP (Streamable HTTP). Claude custom connectors: https://fontlume.com/ladeagent/mcp
    location ^~ /ladeagent/mcp {
        proxy_pass http://127.0.0.1:8765/ladeagent/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Simpel forside der forklarer hvad der ligger her
    location = / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Ladeagent</title><body style="font-family:system-ui;max-width:640px;margin:4rem auto;line-height:1.5"><h1>Ladeagent</h1><p>MCP-server med danske elpriser (DK1/DK2) fra Energinet: billigste ladevindue, omkostning ved konstant forbrug, CO2-prognose og produktionsmix. Read-only tools med faste adgangsgr&aelig;nser, og et write-tool der kun kan oprette et forslag, som et menneske godkender.</p><p>Tilf&oslash;j som custom connector i claude.ai eller Claude Desktop: <code>https://fontlume.com/ladeagent/mcp</code></p><p>Kode, evals og README: <a href="https://github.com/TacoBadger/ladeagent">github.com/TacoBadger/ladeagent</a></p><p>Theis Parker Frost, 2026</p></body>';
    }
}
